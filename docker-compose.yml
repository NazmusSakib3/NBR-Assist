services:
  postgres:
    image: postgres:16-alpine
    container_name: nbr-assist-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nbrassist
      POSTGRES_PASSWORD: nbrassist
      POSTGRES_DB: nbrassist
    ports:
      - "5433:5432"
    volumes:
      - nbr_assist_data:/var/lib/postgresql/data

volumes:
  nbr_assist_data:
